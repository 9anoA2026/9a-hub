<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>9 Ano A</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@300;400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --neon: #00ff99;
    --neon2: #00ccff;
    --bg: #050a12;
    --card: rgba(8, 16, 30, 0.9);
    --border: rgba(0,255,153,0.12);
    --text: rgba(255,255,255,0.85);
    --text-dim: rgba(255,255,255,0.4);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Roboto', sans-serif;
    overflow-x: hidden;
  }

  /* BG animado */
  .bg-anim {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: var(--bg);
    overflow: hidden;
  }
  .bg-anim::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(0,255,153,0.06) 0%, transparent 70%);
    top: -200px; left: -200px;
    animation: drift1 12s ease-in-out infinite alternate;
  }
  .bg-anim::after {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(0,200,255,0.05) 0%, transparent 70%);
    bottom: -150px; right: -150px;
    animation: drift2 15s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(100px, 80px); } }
  @keyframes drift2 { to { transform: translate(-80px, -60px); } }

  /* HEADER */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: rgba(5,10,18,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.3em;
    color: var(--neon);
    text-shadow: 0 0 15px var(--neon);
    letter-spacing: 3px;
    animation: neonPulse 3s ease-in-out infinite;
  }
  .logo span { color: #fff; }
  @keyframes neonPulse {
    0%,100% { text-shadow: 0 0 15px var(--neon); }
    50%      { text-shadow: 0 0 25px var(--neon), 0 0 50px rgba(0,255,153,0.4); }
  }
  .menu-btn {
    width: 36px; height: 36px;
    display: flex; flex-direction: column;
    justify-content: center; gap: 5px;
    cursor: pointer; padding: 4px;
  }
  .menu-btn span {
    display: block; height: 2px;
    background: #fff;
    border-radius: 2px;
    transition: all 0.25s;
    transform-origin: center;
  }
  .menu-btn.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
  .menu-btn.open span:nth-child(2) { opacity: 0; }
  .menu-btn.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

  /* USER BADGE */
  .user-badge {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00ff99, #00ccff);
    display: flex; align-items: center; justify-content: center;
    color: #000; font-weight: 700; font-size: 0.85em;
  }

  /* SIDEBAR */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    backdrop-filter: blur(4px);
  }
  .overlay.open { display: block; }
  .sidebar {
    position: fixed;
    top: 0; left: -280px;
    width: 260px; height: 100%;
    background: rgba(5,12,25,0.98);
    border-right: 1px solid var(--border);
    z-index: 201;
    transition: left 0.3s cubic-bezier(0.4,0,0.2,1);
    display: flex; flex-direction: column;
    padding-top: 56px;
  }
  .sidebar.open { left: 0; }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .sidebar-user {
    display: flex; align-items: center; gap: 10px;
  }
  .sidebar-avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00ff99, #00ccff);
    display: flex; align-items: center; justify-content: center;
    color: #000; font-weight: 700; font-size: 1.1em;
    flex-shrink: 0;
  }
  .sidebar-name { font-weight: 700; font-size: 0.95em; }
  .sidebar-email { font-size: 0.75em; color: var(--text-dim); }
  .nav-items { flex: 1; padding: 8px 0; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.95em;
    border-left: 3px solid transparent;
  }
  .nav-item:hover, .nav-item.active {
    color: var(--neon);
    background: rgba(0,255,153,0.05);
    border-left-color: var(--neon);
  }
  .nav-item .icon { font-size: 1.2em; width: 24px; text-align: center; }
  .logout-btn {
    padding: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; gap: 12px;
    color: #ff6b6b;
    cursor: pointer;
    font-size: 0.9em;
    transition: background 0.2s;
  }
  .logout-btn:hover { background: rgba(255,107,107,0.08); }

  /* MAIN */
  main {
    margin-top: 56px;
    padding: 16px;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
  }

  /* SECTION */
  .section { display: none; }
  .section.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .section-title {
    font-size: 1.3em;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
    color: #fff;
  }
  .section-title span { color: var(--neon); }

  /* CARDS */
  .cards-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media(min-width: 500px) {
    .cards-grid { grid-template-columns: 1fr 1fr; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover { transform: translateY(-2px); border-color: rgba(0,255,153,0.25); }
  .card:hover::before { opacity: 1; }
  .card h3 {
    font-size: 1em; font-weight: 700;
    color: #fff; margin-bottom: 6px;
  }
  .card p { font-size: 0.85em; color: var(--text-dim); line-height: 1.5; }
  .card .date {
    font-size: 0.75em;
    color: var(--neon);
    margin-top: 8px;
    display: flex; align-items: center; gap: 4px;
  }
  .card img {
    width: 100%;
    border-radius: 10px;
    margin-top: 10px;
    object-fit: cover;
    max-height: 160px;
  }

  /* RANKING */
  .ranking-list { display: flex; flex-direction: column; gap: 8px; }
  .ranking-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s;
  }
  .ranking-item:hover { border-color: rgba(0,255,153,0.25); }
  .rank-pos {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1em;
    font-weight: 700;
    width: 36px;
    text-align: center;
    flex-shrink: 0;
  }
  .rank-pos.gold { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
  .rank-pos.silver { color: #c0c0c0; }
  .rank-pos.bronze { color: #cd7f32; }
  .rank-info { flex: 1; }
  .rank-name { font-weight: 700; font-size: 0.95em; }
  .rank-pts { font-size: 0.8em; color: var(--text-dim); }
  .rank-pts strong { color: var(--neon); }
  .rank-medal img { width: 36px; height: 36px; object-fit: contain; }

  /* REGRAS */
  .rule-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    border-left: 3px solid var(--neon);
  }
  .rule-card h3 { font-size: 0.95em; color: var(--neon); margin-bottom: 6px; }
  .rule-card p { font-size: 0.85em; color: var(--text-dim); line-height: 1.6; }

  /* CHAT */
  .chat-wrapper {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 56px - 32px);
    max-height: 700px;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  .chat-messages::-webkit-scrollbar { width: 3px; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(0,255,153,0.2); border-radius: 2px; }
  .msg {
    display: flex;
    gap: 8px;
    max-width: 85%;
    animation: msgIn 0.2s ease;
  }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8em; font-weight: 700;
    margin-top: 2px;
  }
  .msg.user .msg-avatar { background: linear-gradient(135deg, #00ff99, #00ccff); color: #000; }
  .msg.ai .msg-avatar { background: rgba(0,255,153,0.15); color: var(--neon); font-size: 1em; }
  .msg-bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 0.88em;
    line-height: 1.55;
    max-width: 100%;
    word-break: break-word;
  }
  .msg.user .msg-bubble {
    background: linear-gradient(135deg, #006644, #00a366);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.ai .msg-bubble {
    background: rgba(0,255,153,0.07);
    border: 1px solid rgba(0,255,153,0.12);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg-time { font-size: 0.7em; color: var(--text-dim); margin-top: 4px; text-align: right; }
  .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 6px 2px; }
  .typing-dot {
    width: 6px; height: 6px;
    background: var(--neon);
    border-radius: 50%;
    animation: typing 1.2s ease-in-out infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%,80%,100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

  .chat-input-area {
    display: flex;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .chat-input {
    flex: 1;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 11px 16px;
    color: #fff;
    font-family: 'Roboto', sans-serif;
    font-size: 0.9em;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
    max-height: 100px;
    min-height: 44px;
  }
  .chat-input:focus { border-color: rgba(0,255,153,0.4); }
  .chat-input::placeholder { color: rgba(255,255,255,0.25); }
  .send-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #00cc7a, #00ff99);
    color: #000;
    font-size: 1.2em;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    align-self: flex-end;
  }
  .send-btn:hover { transform: scale(1.08); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* LOADING SKELETON */
  .skeleton {
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 8px;
    height: 80px;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 48px 16px;
    color: var(--text-dim);
  }
  .empty .icon { font-size: 3em; margin-bottom: 12px; }
  .empty p { font-size: 0.9em; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(5,12,25,0.95);
    border: 1px solid var(--border);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 0.82em;
    z-index: 999;
    transition: transform 0.3s;
    backdrop-filter: blur(10px);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="bg-anim"></div>

<!-- HEADER -->
<header>
  <div class="menu-btn" id="menuBtn" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </div>
  <div class="logo">9<span>A</span></div>
  <div class="user-badge">
    <div class="avatar" id="headerAvatar">?</div>
  </div>
</header>

<!-- OVERLAY + SIDEBAR -->
<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sidebarAvatar">?</div>
      <div>
        <div class="sidebar-name" id="sidebarName">Carregando...</div>
        <div class="sidebar-email" id="sidebarEmail"></div>
      </div>
    </div>
  </div>
  <div class="nav-items">
    <div class="nav-item active" onclick="showSection('eventos')">
      <span class="icon">📅</span> Eventos
    </div>
    <div class="nav-item" onclick="showSection('ranking')">
      <span class="icon">🏆</span> Ranking
    </div>
    <div class="nav-item" onclick="showSection('regras')">
      <span class="icon">📋</span> Regras
    </div>
    <div class="nav-item" onclick="showSection('chat')">
      <span class="icon">🤖</span> Assistente IA
    </div>
  </div>
  <div class="logout-btn" onclick="logout()">
    <span>🚪</span> Sair da conta
  </div>
</nav>

<!-- MAIN -->
<main>

  <!-- EVENTOS -->
  <section class="section active" id="section-eventos">
    <div class="section-title">📅 <span>Eventos</span></div>
    <div class="cards-grid" id="lista-eventos">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </section>

  <!-- RANKING -->
  <section class="section" id="section-ranking">
    <div class="section-title">🏆 <span>Ranking</span></div>
    <div class="ranking-list" id="lista-ranking">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </section>

  <!-- REGRAS -->
  <section class="section" id="section-regras">
    <div class="section-title">📋 <span>Regras</span></div>
    <div id="lista-regras">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </section>

  <!-- CHAT -->
  <section class="section" id="section-chat">
    <div class="section-title">🤖 <span>Assistente IA</span></div>
    <div class="chat-wrapper">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area">
        <textarea
          class="chat-input"
          id="chat-input"
          placeholder="Pergunte qualquer coisa..."
          rows="1"
          onkeydown="chatKeydown(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="send-btn" onclick="enviarMensagem()">➤</button>
      </div>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
// ===================== CONFIG =====================
const SUPABASE_URL = 'https://hhiynhqsmikecreqnqbt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoaXluaHFzbWlrZWNyZXFucWJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjkzNDcsImV4cCI6MjA5MDI0NTM0N30.nYIPDDuK8PxtYsZi96wAMUqt1Sawh5t5iu-ubwl5h9Y';
const GROQ_API_KEY = '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';

let sb = null;
let currentUser = null;
let chatHistory = [];

// ===================== INIT =====================
window.addEventListener('load', async () => {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data } = await sb.auth.getSession();
  if (!data.session) return window.location.href = 'login.html';

  currentUser = data.session.user;

  // Buscar nome do usuario
  const { data: userData } = await sb.from('users').select('nome').eq('id', currentUser.id).single();
  const nome = userData?.nome || currentUser.email.split('@')[0];
  const inicial = nome[0].toUpperCase();

  document.getElementById('headerAvatar').textContent = inicial;
  document.getElementById('sidebarAvatar').textContent = inicial;
  document.getElementById('sidebarName').textContent = nome;
  document.getElementById('sidebarEmail').textContent = currentUser.email;

  carregarEventos();
  carregarChat();
});

// ===================== MENU =====================
function toggleMenu() {
  const open = document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open', open);
  document.getElementById('menuBtn').classList.toggle('open', open);
  document.body.style.overflow = open ? 'hidden' : '';
}

function closeMenu() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('menuBtn').classList.remove('open');
  document.body.style.overflow = '';
}

function showSection(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('section-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
  closeMenu();

  if (name === 'ranking') carregarRanking();
  if (name === 'regras') carregarRegras();
  if (name === 'chat') document.getElementById('chat-messages').scrollTop = 999999;
}

// ===================== LOGOUT =====================
async function logout() {
  await sb.auth.signOut();
  window.location.href = 'login.html';
}

// ===================== EVENTOS =====================
async function carregarEventos() {
  const { data: eventos, error } = await sb.from('eventos').select('*').order('data', { ascending: true });
  const container = document.getElementById('lista-eventos');

  if (error || !eventos?.length) {
    container.innerHTML = '<div class="empty"><div class="icon">📅</div><p>Nenhum evento por enquanto</p></div>';
    return;
  }

  container.innerHTML = eventos.map(ev => {
    const data = ev.data ? new Date(ev.data).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }) : '';
    return `
      <div class="card">
        <h3>${ev.titulo || 'Evento'}</h3>
        <p>${ev.descricao || ''}</p>
        ${data ? `<div class="date">📆 ${data}</div>` : ''}
        ${ev.imagem ? `<img src="${ev.imagem}" alt="${ev.titulo}" loading="lazy" onerror="this.style.display='none'">` : ''}
      </div>
    `;
  }).join('');
}

// ===================== RANKING =====================
async function carregarRanking() {
  const { data: ranking, error } = await sb.from('ranking').select('*, users(nome, email)').order('pontos', { ascending: false });
  const container = document.getElementById('lista-ranking');

  if (error || !ranking?.length) {
    container.innerHTML = '<div class="empty"><div class="icon">🏆</div><p>Ranking vazio por enquanto</p></div>';
    return;
  }

  const medals = ['🥇', '🥈', '🥉'];
  const posClass = ['gold', 'silver', 'bronze'];

  container.innerHTML = ranking.map((rk, i) => {
    const nome = rk.users?.nome || rk.users?.email || 'Aluno';
    const pos = i < 3 ? `<span class="rank-pos ${posClass[i]}">${medals[i]}</span>` : `<span class="rank-pos">${i + 1}°</span>`;
    return `
      <div class="ranking-item">
        ${pos}
        <div class="rank-info">
          <div class="rank-name">${nome}</div>
          <div class="rank-pts">Pontuacao: <strong>${rk.pontos || 0}</strong></div>
        </div>
        ${rk.medalha ? `<div class="rank-medal"><img src="${rk.medalha}" alt="medalha" onerror="this.style.display='none'"></div>` : ''}
      </div>
    `;
  }).join('');
}

// ===================== REGRAS =====================
async function carregarRegras() {
  const { data: regras, error } = await sb.from('regras').select('*');
  const container = document.getElementById('lista-regras');

  if (error || !regras?.length) {
    container.innerHTML = '<div class="empty"><div class="icon">📋</div><p>Nenhuma regra cadastrada</p></div>';
    return;
  }

  container.innerHTML = regras.map(r => `
    <div class="rule-card">
      <h3>${r.titulo || 'Regra'}</h3>
      <p>${r.conteudo || ''}</p>
      ${r.imagem ? `<img src="${r.imagem}" style="width:100%;border-radius:8px;margin-top:8px;" loading="lazy" onerror="this.style.display='none'">` : ''}
    </div>
  `).join('');
}

// ===================== CHAT =====================
async function carregarChat() {
  const { data: msgs } = await sb.from('chat').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: true }).limit(30);
  const container = document.getElementById('chat-messages');
  container.innerHTML = '';

  if (!msgs?.length) {
    addMessage('ai', 'Oi! Sou o Assistente do 9A Hub. Posso te ajudar com duvidas de materias, horarios e muito mais. O que voce precisa?');
    return;
  }

  msgs.forEach(m => {
    addMessage('user', m.mensagem, false);
    if (m.resposta && m.resposta !== '...') addMessage('ai', m.resposta, false);
    chatHistory.push({ role: 'user', content: m.mensagem });
    chatHistory.push({ role: 'assistant', content: m.resposta || '' });
  });
  container.scrollTop = container.scrollHeight;
}

function addMessage(role, text, scroll = true) {
  const container = document.getElementById('chat-messages');
  const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="msg-avatar">${role === 'user' ? '?' : '🤖'}</div>
    <div>
      <div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>
      <div class="msg-time">${time}</div>
    </div>
  `;

  // Atualizar avatar do usuario
  if (role === 'user') {
    const av = document.getElementById('headerAvatar');
    div.querySelector('.msg-avatar').textContent = av.textContent;
  }

  container.appendChild(div);
  if (scroll) container.scrollTop = container.scrollHeight;
}

function addTyping() {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing-msg';
  div.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div class="msg-bubble">
      <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-msg');
  if (el) el.remove();
}

async function enviarMensagem() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;
  addMessage('user', msg);

  // Salvar no Supabase
  const { data: saved } = await sb.from('chat').insert([{
    user_id: currentUser.id,
    mensagem: msg,
    resposta: '...'
  }]).select().single();

  addTyping();

  // Chamar Groq
  let resposta = '';
  try {
    chatHistory.push({ role: 'user', content: msg });

    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${GROQ_API_KEY}`
      },
      body: JSON.stringify({
        model: 'llama3-8b-8192',
        messages: [
          {
            role: 'system',
            content: 'Voce e o Assistente do 9A Hub, um app para turma escolar de 9 ano. Responda sempre em portugues brasileiro de forma amigavel e didatica. Nao resolva exercicios diretamente, explique o raciocinio para que o aluno aprenda. Seja util, objetivo e motivador.'
          },
          ...chatHistory.slice(-10)
        ],
        max_tokens: 800,
        temperature: 0.7
      })
    });

    const data = await res.json();
    resposta = data.choices?.[0]?.message?.content || 'Nao consegui processar sua mensagem.';
    chatHistory.push({ role: 'assistant', content: resposta });
  } catch (e) {
    resposta = 'Erro ao conectar com a IA. Verifique sua conexao e tente novamente.';
  }

  removeTyping();
  addMessage('ai', resposta);

  // Atualizar resposta no Supabase
  if (saved?.id) {
    await sb.from('chat').update({ resposta }).eq('id', saved.id);
  }

  document.getElementById('send-btn').disabled = false;
}

function chatKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    enviarMensagem();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
